<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blooma: Пожежний радар</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e0701c'/%3E%3Cpath transform='translate(12 12) scale(1.3) translate(-12 -11.3)' d='M12.4 4.2c.5 2.9-1.2 4.4-2.6 5.9C8.6 11.4 8 12.6 8 14.3a4 4 0 0 0 8 0c0-1.9-.8-3.3-1.8-4.4-.3 1.1-.9 1.8-1.7 2.2.3-2.8-.3-5.4-.1-7.9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <span class="wordmark"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#e0701c"/><path transform="translate(12 12) scale(1.3) translate(-12 -11.3)" d="M12.4 4.2c.5 2.9-1.2 4.4-2.6 5.9C8.6 11.4 8 12.6 8 14.3a4 4 0 0 0 8 0c0-1.9-.8-3.3-1.8-4.4-.3 1.1-.9 1.8-1.7 2.2.3-2.8-.3-5.4-.1-7.9z" fill="#fff"/></svg>Blooma</span>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-fire" data-tab="fire" data-i18n="tab_fire"></button>
      <button type="button" role="tab" id="tab-heat" data-tab="heat" data-i18n="tab_heat"></button>
    </nav>
    <div class="controls">
      <div class="seg" role="group" aria-label="Data source">
        <button id="mode-demo" type="button" data-i18n="mode_demo"></button>
        <button id="mode-live" type="button" data-i18n="mode_live"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="uk">UA</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div id="notes" class="notes"></div>
  <div id="error" class="error" hidden></div>

  <main id="view-fire" class="view">
    <section class="card">
      <div class="section-head">
        <h2 data-i18n="f_days"></h2>
        <span class="hint" data-i18n="f_days_hint"></span>
      </div>
      <div id="f-days" class="days"></div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="section-head">
          <h2 data-i18n="f_map"></h2>
          <span class="hint" data-i18n="f_map_hint"></span>
        </div>
        <div id="f-map" class="map tall"></div>
        <div id="f-legend" class="legend"></div>
      </div>
      <div class="side">
        <div id="f-summary" class="kpis"></div>
        <div class="card">
          <h3 id="f-rank-title" class="sub"></h3>
          <div id="f-rank"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 id="f-city-title"></h2>
        <span class="hint" id="f-city-hint"></span>
      </div>
      <div class="city-grid">
        <div id="f-chart" class="chart"></div>
        <div id="f-advice" class="advice-box"></div>
      </div>
      <div id="f-table" class="table-wrap"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="f_circles"></h2>
      </div>
      <p class="hint" data-i18n="f_circles_hint" style="margin:0"></p>
      <div id="f-message" class="message"></div>
    </section>
  </main>

  <main id="view-heat" class="view" hidden>
    <section class="card controls-card">
      <label><span data-i18n="h_city"></span>
        <select id="h-city"></select>
      </label>
      <label><span data-i18n="h_force"></span>
        <select id="h-force">
          <option value="auto" data-i18n="h_force_auto"></option>
          <option value="2" data-i18n="h_force_2"></option>
          <option value="3" data-i18n="h_force_3"></option>
        </select>
      </label>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="h_days"></h2>
        <span class="hint" data-i18n="h_days_hint"></span>
      </div>
      <div id="h-days" class="days"></div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="section-head">
          <h2 data-i18n="h_map"></h2>
          <span class="hint" id="h-map-hint"></span>
        </div>
        <div id="h-map" class="map"></div>
        <div class="legend">
          <span><i class="dot high"></i><span data-i18n="lg_high"></span></span>
          <span><i class="dot medium"></i><span data-i18n="lg_medium"></span></span>
          <span><i class="dot vol"></i><span data-i18n="lg_vol"></span></span>
          <span><i class="dot other"></i><span data-i18n="lg_other"></span></span>
          <span><i class="sq"></i><span data-i18n="lg_place"></span></span>
          <span><i class="ln"></i><span data-i18n="lg_link"></span></span>
        </div>
      </div>
      <div class="side">
        <div id="h-day-card" class="card day-card"></div>
        <div id="h-fire-card" class="card"></div>
        <div id="h-kpis" class="kpis"></div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="h_groups"></h2>
        <span class="hint" data-i18n="h_groups_hint"></span>
      </div>
      <div id="h-groups" class="groups"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="h_checks"></h2>
        <button id="h-reset" type="button" class="ghost" data-i18n="h_reset"></button>
      </div>
      <div id="h-checks"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 data-i18n="h_sim"></h2>
        <div class="seg small" role="group">
          <button id="sim-all" type="button" data-i18n="sim_all"></button>
          <button id="sim-alone" type="button" data-i18n="sim_alone"></button>
        </div>
      </div>
      <div class="sim">
        <div id="sim-chart" class="chart"></div>
        <div id="sim-kpis" class="sim-kpis"></div>
      </div>
      <p id="sim-assumptions" class="assumptions"></p>
    </section>
  </main>

  <footer>
    <p data-i18n="foot_data"></p>
  </footer>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="/i18n.js"></script>
  <script src="/map.js"></script>
  <script src="/app.js"></script>
  <script src="/fire.js"></script>
  <script src="/heat.js"></script>
  <script>start();</script>
</body>
</html>
